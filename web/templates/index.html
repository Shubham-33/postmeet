<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Postmeet — meeting → action items</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; }
    .col-scroll::-webkit-scrollbar { height: 10px; }
    .col-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 6px; }
    .card-hover:hover { transform: translateY(-2px); transition: transform 0.15s; }
  </style>
</head>
<body class="text-slate-100">

  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:bg-indigo-600 focus:text-white focus:px-3 focus:py-2 focus:rounded">Skip to content</a>

  <!-- Header -->
  <header class="px-6 py-5 border-b border-white/5" role="banner">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-500 to-fuchsia-500 flex items-center justify-center font-bold" aria-hidden="true">P</div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Postmeet</h1>
          <p class="text-xs text-slate-300">Paste a meeting → get a board → distribute in one click.</p>
        </div>
      </div>
      <span class="text-xs text-slate-300">PromptWars 2026</span>
    </div>
  </header>

  <main id="main">
  <!-- Input section -->
  <section class="max-w-7xl mx-auto px-6 py-6" aria-labelledby="inputLabel">
    <div class="bg-white/5 backdrop-blur rounded-xl border border-white/10 p-5">
      <!-- Mode tabs -->
      <div class="flex items-center gap-1 mb-4" role="tablist" aria-label="Input mode">
        <button id="tabText" type="button" role="tab" aria-selected="true" aria-controls="textPanel"
          class="text-xs px-3 py-1.5 rounded-md bg-white/10 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-400">Paste text</button>
        <button id="tabDoc" type="button" role="tab" aria-selected="false" aria-controls="docPanel"
          class="text-xs px-3 py-1.5 rounded-md text-slate-300 hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-indigo-400">📄 Google Doc URL</button>
      </div>

      <!-- Text panel -->
      <div id="textPanel" role="tabpanel" aria-labelledby="tabText">
        <div class="flex items-center justify-between mb-3">
          <label id="inputLabel" for="transcript" class="text-sm font-medium text-slate-200">Meeting transcript or notes</label>
          <button id="loadSample" type="button" class="text-xs text-indigo-300 hover:text-indigo-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 rounded px-2 py-1" aria-label="Load sample transcript">Load sample</button>
        </div>
        <textarea id="transcript" rows="6"
          aria-describedby="inputHint"
          class="w-full bg-slate-900/60 border border-white/10 rounded-lg p-3 text-sm font-mono text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"
          placeholder="Paste your meeting transcript here..."></textarea>
      </div>

      <!-- Doc URL panel -->
      <div id="docPanel" role="tabpanel" aria-labelledby="tabDoc" class="hidden">
        <label for="docUrl" class="block text-sm font-medium text-slate-200 mb-2">Google Doc URL</label>
        <input id="docUrl" type="url"
          placeholder="https://docs.google.com/document/d/..."
          class="w-full bg-slate-900/60 border border-white/10 rounded-lg p-3 text-sm font-mono text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <p class="text-xs text-slate-400 mt-2">Doc must be shared as <span class="text-slate-200">Anyone with the link can view</span>. No OAuth needed.</p>
      </div>

      <div class="flex items-center justify-between mt-3 gap-3">
        <p id="status" class="text-xs text-slate-300 flex-1" role="status" aria-live="polite"></p>
        <p id="inputHint" class="text-xs text-slate-400 hidden sm:block">Tip: ⌘/Ctrl + Enter to extract</p>
        <button id="extractBtn" type="button"
          aria-label="Extract decisions and action items"
          class="px-4 py-2 rounded-lg bg-gradient-to-r from-indigo-500 to-fuchsia-500 hover:from-indigo-400 hover:to-fuchsia-400 text-white text-sm font-semibold shadow-lg shadow-indigo-500/30 disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-indigo-400">
          Extract →
        </button>
      </div>
    </div>
  </section>

  <!-- Summary + Distribute -->
  <section id="summarySection" class="max-w-7xl mx-auto px-6 hidden" aria-label="Meeting summary and bulk actions">
    <div class="bg-amber-400/10 border border-amber-400/20 rounded-xl p-4 mb-5 flex flex-col sm:flex-row sm:items-start gap-4">
      <div class="flex-1">
        <p class="text-xs uppercase tracking-wider text-amber-200 font-semibold mb-1">Summary</p>
        <p id="summaryText" class="text-sm text-amber-50"></p>
      </div>
      <div class="flex gap-2 flex-shrink-0">
        <button id="distributeCalBtn" type="button"
          aria-label="Open Google Calendar prefill for every action item"
          class="text-xs px-3 py-2 rounded-lg bg-indigo-500/30 hover:bg-indigo-500/50 text-indigo-100 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-400">
          📅 All Calendars
        </button>
        <button id="distributeMailBtn" type="button"
          aria-label="Open Gmail compose for every action item owner"
          class="text-xs px-3 py-2 rounded-lg bg-fuchsia-500/30 hover:bg-fuchsia-500/50 text-fuchsia-100 font-semibold focus:outline-none focus:ring-2 focus:ring-fuchsia-400">
          ✉️ All Emails
        </button>
      </div>
    </div>
  </section>

  <!-- Trello board -->
  <section class="max-w-7xl mx-auto px-6 pb-12" aria-label="Action items board">
    <div id="board" role="region" aria-live="polite" aria-label="Decisions and action items grouped by owner" class="flex gap-4 overflow-x-auto col-scroll pb-4 min-h-[300px]">
      <div id="emptyState" class="w-full text-center text-slate-400 text-sm py-16">
        Paste a transcript above and hit <span class="text-indigo-300">Extract</span> to see the board.
      </div>
    </div>
  </section>
  </main>

  <script src="/static/postmeet.js" defer></script>
</body>
</html>

name: Keep Render app warm

# Render's free tier sleeps after ~15 min idle (→ ~40s cold start). This pings
# the live app on a schedule so a recruiter's first click loads instantly.
# Note: GitHub cron can be delayed under load, and scheduled workflows auto-pause
# after ~60 days of repo inactivity — re-run manually (or push) to resume.

on:
  schedule:
    - cron: "*/12 * * * *"   # every 12 minutes (:00, :12, :24, :36, :48)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live app
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://postmeet.onrender.com/)
          echo "Ping returned HTTP $code"
          # 200 = warm/served. Don't fail the job on a slow cold start.
          test "$code" = "200" || echo "non-200 (likely mid cold-start) — not failing the job"
